# XcodeGen spec for the SpoofRemote iPhone app.
#   brew install xcodegen
#   iPhoneRemote/scripts/fetch-idevice.sh     # once: the iPhone-only mode's library
#   cd iPhoneRemote && xcodegen && open SpoofRemote.xcodeproj
# Then pick your team under Signing & Capabilities and run on your iPhone.
name: SpoofRemote
options:
  bundleIdPrefix: com.iosgpsspoof
  deploymentTarget:
    iOS: "17.0"
packages:
  iOSGPSSpoofer:
    path: ..
targets:
  SpoofRemote:
    type: application
    platform: iOS
    sources:
      - path: SpoofRemote
    # Copy the repo root VERSION into BuildVersion.swift before compiling, so
    # SpoofRemote knows the version it was built from and can tell when a newer
    # release is out. Writes only when VERSION changed, so the tree stays clean.
    preBuildScripts:
      - name: Stamp the repo VERSION into the app
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          VERSION_FILE="${SRCROOT}/../VERSION"
          OUT="${SRCROOT}/SpoofRemote/BuildVersion.swift"
          [ -f "$VERSION_FILE" ] || { echo "no VERSION file; keeping $OUT"; exit 0; }
          V="$(tr -d '[:space:]' < "$VERSION_FILE")"
          TMP="$(mktemp)"
          cat > "$TMP" <<EOF
          // Generated at build time from the repo root VERSION, by the
          // "Stamp the repo VERSION into the app" phase in iPhoneRemote/project.yml.
          // The checked-in value is a fallback and should match VERSION.
          enum BuildVersion {
              /// The project VERSION this build of SpoofRemote was made from.
              static let version = "$V"
          }
          EOF
          if ! cmp -s "$TMP" "$OUT"; then
            mv "$TMP" "$OUT"
            echo "BuildVersion.swift set to $V"
          else
            rm -f "$TMP"
          fi
    dependencies:
      - package: iOSGPSSpoofer
        product: RemoteAPI
      # The pairing file's format and the tunnel rules, shared with the Mac app.
      - package: iOSGPSSpoofer
        product: PhoneOnlyCore
      # idevice, for the iPhone-only mode. Static, so nothing to embed.
      - framework: Vendor/IDevice.xcframework
        embed: false
    settings:
      base:
        # The app is called AnyWhere. The target, scheme and bundle ID keep the original
        # name on purpose: an installed copy updates in place and keeps its Keychain items.
        PRODUCT_NAME: AnyWhere
        PRODUCT_BUNDLE_IDENTIFIER: com.iosgpsspoof.remote
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SpoofRemote/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AnyWhere
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Your Apple ID team (a free one works for your own iPhone):
        DEVELOPMENT_TEAM: ""
