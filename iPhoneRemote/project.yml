# XcodeGen spec for the SpoofRemote iPhone app.
#   brew install xcodegen
#   cd iPhoneRemote && xcodegen && open SpoofRemote.xcodeproj
# Then pick your team under Signing & Capabilities and run on your iPhone.
name: SpoofRemote
options:
  bundleIdPrefix: com.iosgpsspoof
  deploymentTarget:
    iOS: "17.0"
packages:
  iOSGPSSpoofer:
    path: ..
targets:
  SpoofRemote:
    type: application
    platform: iOS
    sources:
      - path: SpoofRemote
    dependencies:
      - package: iOSGPSSpoofer
        product: RemoteAPI
    settings:
      base:
        PRODUCT_NAME: SpoofRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.iosgpsspoof.remote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SpoofRemote/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SpoofRemote
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Your Apple ID team (a free one works for your own iPhone):
        DEVELOPMENT_TEAM: ""
