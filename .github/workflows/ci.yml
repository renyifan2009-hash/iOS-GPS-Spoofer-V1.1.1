name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-helper:
    name: Live helper · pymobiledevice3 ${{ matrix.pymobiledevice3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 11.0.0 is the first release with --native (what the app uses by default).
        pymobiledevice3: ["11.0.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pymobiledevice3
        run: |
          if [ "${{ matrix.pymobiledevice3 }}" = "latest" ]; then
            pip install pymobiledevice3
          else
            pip install "pymobiledevice3==${{ matrix.pymobiledevice3 }}"
          fi
          pip show pymobiledevice3 | head -2
      - name: Helper tests (extracted from LiveHelperScript.swift)
        run: python Tests/LiveHelperTests/test_live_helper.py

  macos:
    name: Build & test · macOS
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (debug, with tests)
        run: swift build --build-tests

      - name: Unit tests
        run: swift test --skip-build

      # The real app (debug build), with a pretend iPhone: play a route and a
      # joystick session and check the app keeps moving the "device".
      - name: App smoke test with a pretend iPhone
        run: |
          BIN="$(swift build --show-bin-path)/iosgpsspoofer-gui"
          defaults write iosgpsspoofer-gui hasSeenWelcome -bool true
          for demo in route joystick; do
            LOG="$RUNNER_TEMP/fake-$demo.log"
            SPOOFER_SNAPSHOT=1 SPOOFER_DEMO=$demo PYMOBILEDEVICE3="$PWD/Tests/Fixtures/fake-pymobiledevice3" \
              FAKE_PMD_LOG="$LOG" "$BIN" > "$RUNNER_TEMP/app-$demo.log" 2>&1 &
            PID=$!
            sleep 15
            kill -0 $PID   # still running: no crash
            kill -TERM $PID
            wait $PID || true
            MOVES=$(grep -c "simulate-location set" "$LOG" || true)
            echo "$demo: $MOVES location updates"
            grep "SNAPSHOT-STATS" "$RUNNER_TEMP/app-$demo.log" | tail -2
            test "$MOVES" -ge 10
          done

      # Nothing covers the window on a runner, so MapKit draws the map too.
      - name: Screenshots of the app (pretend iPhone)
        run: |
          BIN="$(swift build --show-bin-path)/iosgpsspoofer-gui"
          SHOTS="$RUNNER_TEMP/screenshots"
          mkdir -p "$SHOTS"
          shoot() {   # shoot <name> <demo|none> <seconds> [VAR=value…]
            name=$1; demo=$2; wait=$3; shift 3
            env SPOOFER_SNAPSHOT=1 SPOOFER_DEMO="$demo" PYMOBILEDEVICE3="$PWD/Tests/Fixtures/fake-pymobiledevice3" \
              "$@" "$BIN" > "$RUNNER_TEMP/shot-$name.log" 2>&1 &
            pid=$!
            sleep "$wait"
            wid="$(grep -m1 '^SNAPSHOT-WINDOW' "$RUNNER_TEMP/shot-$name.log" | awk '{print $2}')"
            screencapture -l "$wid" -o -x "$SHOTS/$name.png" || echo "no screenshot for $name"
            kill -TERM "$pid"
            wait "$pid" || true
          }
          shoot route route 14
          shoot joystick joystick 12
          shoot teleport teleport 12
          shoot route-dark route 14 SPOOFER_APPEARANCE=dark
          # A loop on real roads (asks Apple Maps), in a bigger window: the README's picture.
          shoot route-roads route-roads 20 SPOOFER_WINDOW_SIZE=1440x900
          defaults write iosgpsspoofer-gui hasSeenWelcome -bool false
          shoot welcome none 8
          ls -la "$SHOTS"

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: "Build (release: CLI + GUI)"
        run: swift build -c release

      - name: Set up pymobiledevice3
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pymobiledevice3
          .venv/bin/pymobiledevice3 version

      - name: The compiled-in helper passes the helper tests
        run: |
          .build/release/iosgpsspoof dump-helper > "$RUNNER_TEMP/live_helper.py"
          LIVE_HELPER_PATH="$RUNNER_TEMP/live_helper.py" .venv/bin/python Tests/LiveHelperTests/test_live_helper.py

      - name: CLI smoke test
        run: |
          set -x
          .build/release/iosgpsspoof --help
          .build/release/iosgpsspoof route --help
          .build/release/iosgpsspoof serve --help
          .build/release/iosgpsspoof list --json || true
          # No iPhone on the runner, so doctor reports a problem — but the live
          # engine probe must succeed against a real pymobiledevice3 on macOS.
          .build/release/iosgpsspoof doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          grep -q "supported (pymobiledevice3" "$RUNNER_TEMP/doctor.txt"

      - name: Package the app
        run: |
          VERSION="$(cat VERSION)-ci.${GITHUB_RUN_NUMBER}" ./package-dmg.sh
          ls -la dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: iOS-GPS-Spoofer-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  # What a tester runs, on a Mac that has never seen the project.
  installer:
    name: Installer · clean Mac
    runs-on: macos-15
    timeout-minutes: 40
    env:
      SPOOFER_APP_DIR: ${{ github.workspace }}/../Applications
    steps:
      - uses: actions/checkout@v4

      - name: ./setup.sh
        run: ./setup.sh --no-open

      - name: The installed app is signed and finds its helper
        run: |
          APP="$SPOOFER_APP_DIR/iOS GPS Spoofer.app"
          codesign --verify --deep --strict "$APP"
          /usr/libexec/PlistBuddy -c "Print :SpooferGitCommit" "$APP/Contents/Info.plist"
          # Like a Finder launch: no project folder, a bare PATH. No iPhone on
          # the runner, so doctor reports a problem, but the helper must be found.
          (cd / && env -i HOME="$HOME" PATH=/usr/bin:/bin "$APP/Contents/MacOS/iosgpsspoof" doctor) \
            | tee "$RUNNER_TEMP/doctor.txt" || true
          grep -q "supported (pymobiledevice3" "$RUNNER_TEMP/doctor.txt"

      - name: Running it again updates in place
        run: ./setup.sh --no-open

      - name: The one-line installer (install.sh piped into bash)
        if: github.event_name == 'push'
        env:
          SPOOFER_REPO: ${{ github.repository }}
          SPOOFER_REF: ${{ github.sha }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${SPOOFER_REPO}/${SPOOFER_REF}/install.sh" | bash -s -- --no-open
          /usr/libexec/PlistBuddy -c "Print :SpooferGitCommit" "$SPOOFER_APP_DIR/iOS GPS Spoofer.app/Contents/Info.plist" \
            | grep -qx "$SPOOFER_REF"

      - name: ./setup.sh --uninstall
        run: |
          ./setup.sh --uninstall
          test ! -e "$SPOOFER_APP_DIR/iOS GPS Spoofer.app"

  # The job above builds with Xcode 16 (macOS 15 SDK), so Liquid Glass compiles
  # out there. This one builds the Liquid Glass code path with the newest Xcode 26.
  macos-xcode26:
    name: Build · Xcode 26 (Liquid Glass)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          XCODES=(/Applications/Xcode_26*.app)
          XCODE="$(printf '%s\n' "${XCODES[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version
          xcodebuild -version
          echo "macOS SDK $(xcrun --show-sdk-version)"

      - name: "Build (release: CLI + GUI)"
        run: swift build -c release

      - name: Unit tests
        run: swift test

  # A tester's setup that once broke the build: a newer Swift from swift.org
  # (installed with swiftly) paired with the older macOS 15 SDK of Command Line
  # Tools / Xcode 16. The compiler is new enough for Liquid Glass but the SDK
  # isn't, so the glass code must compile out.
  macos-swiftorg-old-sdk:
    name: Build · swift.org toolchain + macOS 15 SDK
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest swift.org toolchain (swiftly)
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes

      - name: Toolchain
        run: |
          . "$HOME/.swiftly/env.sh"
          command -v swift
          swift --version
          echo "macOS SDK $(xcrun --show-sdk-version) at $(xcrun --show-sdk-path)"

      - name: "Build (release: CLI + GUI)"
        run: |
          . "$HOME/.swiftly/env.sh"
          swift build -c release

  iphone-remote:
    name: Build · SpoofRemote iPhone app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      # idevice, the iPhone-only mode's library: a 210 MB download, kept
      # between runs.
      - name: Cache the idevice download
        uses: actions/cache@v4
        with:
          path: ~/idevice-cache
          key: idevice-${{ hashFiles('iPhoneRemote/scripts/fetch-idevice.sh') }}

      - name: Fetch idevice
        run: IDEVICE_CACHE_DIR="$HOME/idevice-cache" iPhoneRemote/scripts/fetch-idevice.sh

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iPhoneRemote && xcodegen

      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild -project iPhoneRemote/SpoofRemote.xcodeproj -scheme SpoofRemote \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build

      # The file testers install with Sideloadly, which signs it with their own
      # Apple ID. Built with the newest Xcode 26, for the iOS 26 design.
      - name: Build for iPhones (unsigned .ipa)
        run: |
          XCODES=(/Applications/Xcode_26*.app)
          XCODE="$(printf '%s\n' "${XCODES[@]}" | sort -V | tail -1)"
          export DEVELOPER_DIR="$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -project iPhoneRemote/SpoofRemote.xcodeproj -scheme SpoofRemote \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/device" CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/Release-iphoneos/SpoofRemote.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/SpoofRemote.ipa" Payload)
          ls -la SpoofRemote.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SpoofRemote-ipa
          path: SpoofRemote.ipa
          if-no-files-found: error
          retention-days: 14
