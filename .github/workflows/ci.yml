name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-helper:
    name: Live helper · pymobiledevice3 ${{ matrix.pymobiledevice3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 11.0.0 is the first release with --native (what the app uses by default).
        pymobiledevice3: ["11.0.0", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pymobiledevice3
        run: |
          if [ "${{ matrix.pymobiledevice3 }}" = "latest" ]; then
            pip install pymobiledevice3
          else
            pip install "pymobiledevice3==${{ matrix.pymobiledevice3 }}"
          fi
          pip show pymobiledevice3 | head -2
      - name: Helper tests (extracted from LiveHelperScript.swift)
        run: python Tests/LiveHelperTests/test_live_helper.py

  macos:
    name: Build & test · macOS
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (debug, with tests)
        run: swift build --build-tests

      - name: Unit tests
        run: swift test --skip-build

      - name: "Build (release: CLI + GUI)"
        run: swift build -c release

      - name: Set up pymobiledevice3
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pymobiledevice3
          .venv/bin/pymobiledevice3 version

      - name: The compiled-in helper passes the helper tests
        run: |
          .build/release/iosgpsspoof dump-helper > "$RUNNER_TEMP/live_helper.py"
          LIVE_HELPER_PATH="$RUNNER_TEMP/live_helper.py" .venv/bin/python Tests/LiveHelperTests/test_live_helper.py

      - name: CLI smoke test
        run: |
          set -x
          .build/release/iosgpsspoof --help
          .build/release/iosgpsspoof route --help
          .build/release/iosgpsspoof serve --help
          .build/release/iosgpsspoof list --json || true
          # No iPhone on the runner, so doctor reports a problem — but the live
          # engine probe must succeed against a real pymobiledevice3 on macOS.
          .build/release/iosgpsspoof doctor | tee "$RUNNER_TEMP/doctor.txt" || true
          grep -q "supported (pymobiledevice3" "$RUNNER_TEMP/doctor.txt"

      - name: Package the app
        run: |
          VERSION="2.0.0-ci.${GITHUB_RUN_NUMBER}" ./package-dmg.sh --no-venv
          ls -la dist

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: iOS-GPS-Spoofer-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  # The job above builds with Xcode 16 (macOS 15 SDK), so Liquid Glass compiles
  # out there. This one builds the Liquid Glass code path with the newest Xcode 26.
  macos-xcode26:
    name: Build · Xcode 26 (Liquid Glass)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          XCODES=(/Applications/Xcode_26*.app)
          XCODE="$(printf '%s\n' "${XCODES[@]}" | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          swift --version
          xcodebuild -version
          echo "macOS SDK $(xcrun --show-sdk-version)"

      - name: "Build (release: CLI + GUI)"
        run: swift build -c release

      - name: Unit tests
        run: swift test

  # A tester's setup that once broke the build: a newer Swift from swift.org
  # (installed with swiftly) paired with the older macOS 15 SDK of Command Line
  # Tools / Xcode 16. The compiler is new enough for Liquid Glass but the SDK
  # isn't, so the glass code must compile out.
  macos-swiftorg-old-sdk:
    name: Build · swift.org toolchain + macOS 15 SDK
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest swift.org toolchain (swiftly)
        run: |
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes

      - name: Toolchain
        run: |
          . "$HOME/.swiftly/env.sh"
          command -v swift
          swift --version
          echo "macOS SDK $(xcrun --show-sdk-version) at $(xcrun --show-sdk-path)"

      - name: "Build (release: CLI + GUI)"
        run: |
          . "$HOME/.swiftly/env.sh"
          swift build -c release

  iphone-remote:
    name: Build · SpoofRemote iPhone app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iPhoneRemote && xcodegen

      - name: Build for the iOS Simulator (unsigned)
        run: |
          xcodebuild -project iPhoneRemote/SpoofRemote.xcodeproj -scheme SpoofRemote \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
